name: Orion Scraper Daily Update

on:
  schedule:
    - cron: '0 12 * * *' # Everyday at 3:00 PM Egypt Time (12:00 UTC)
  workflow_dispatch:
    inputs:
      start_pos:
        description: 'Start Position (e.g. 45.0W)'
        required: true
        default: '45.0W'
      end_pos:
        description: 'End Position (e.g. 108.2E)'
        required: true
        default: '108.2E'
      separate_bands:
        description: 'Separate C/KU bands? (true/false)'
        required: true
        default: 'true'
      add_advanced:
        description: 'Add MIS/PLS/T2-MI? (true/false)'
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: orion-scraper
      cancel-in-progress: false

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: scripts
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: Run scraper and validate output
        shell: bash
        run: |
          set -euo pipefail

          START="${{ github.event.inputs.start_pos || '45.0W' }}"
          END="${{ github.event.inputs.end_pos || '108.2E' }}"
          SEP_FLAG=""
          if [[ "${{ github.event.inputs.separate_bands || 'true' }}" == "true" ]]; then
            SEP_FLAG="--separate"
          fi

          ADV_FLAG=""
          if [[ "${{ github.event.inputs.add_advanced || 'true' }}" == "true" ]]; then
            ADV_FLAG="--advanced"
          fi

          python CI/orion_ci.py --start "$START" --end "$END" $SEP_FLAG $ADV_FLAG

          if [[ ! -s satellites.xml ]]; then
            echo "ERROR: satellites.xml is empty after scraping. Stopping workflow to avoid overwriting valid data."
            exit 1
          fi

          SATELLITE_COUNT=$(grep -c '<sat ' satellites.xml || true)
          TRANSPONDER_COUNT=$(grep -c '<transponder ' satellites.xml || true)

          if [[ "$SATELLITE_COUNT" -eq 0 || "$TRANSPONDER_COUNT" -eq 0 ]]; then
            echo "ERROR: satellites.xml has no satellites/transponders (satellites=$SATELLITE_COUNT, transponders=$TRANSPONDER_COUNT)."
            echo "Stopping workflow to avoid committing invalid scraped data."
            exit 1
          fi

          python CI/process_satellites.py satellites.xml

      - name: Commit, rebase, and push satellites.xml
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add satellites.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update satellites.xml - $(date -u)"

          git fetch origin scripts

          if ! git pull --rebase origin scripts; then
            echo "Rebase conflict detected while updating from origin/scripts"
            git rebase --abort || true
            exit 1
          fi

          git push origin HEAD:scripts
